body: |-
  ## Context
  
  Google tag `gtag.js` and Google Tag Manager both support browser-side tagging, but they are different runtime and deployment surfaces. `gtag.js` exposes browser commands, while GTM provides container-managed tags, triggers, variables, and data-layer integration.
  
  Downstream repositories need separate decisions for direct Google tag instrumentation and GTM-managed deployment because evidence, failure modes, and operational ownership differ.
  
  ## Decision
  
  This repository will treat Google tag `gtag.js` and Google Tag Manager as distinct Google tagging runtime surfaces.
  
  Packaged templates may require downstream repositories to decide whether they use direct `gtag.js`, GTM, both, or neither.
  
  `gtag.js` runtime support must not be treated as proof of GTM container behavior, and GTM deployment support must not be treated as proof of direct `gtag.js` command correctness.
