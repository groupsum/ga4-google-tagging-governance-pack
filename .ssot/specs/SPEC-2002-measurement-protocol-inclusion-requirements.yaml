body: |-
  ## Scope
  
  This specification governs inclusion of GA4 Measurement Protocol targets in `pack:ga4-google-tagging`.
  
  ## Requirements
  
  - The pack MUST include Measurement Protocol request construction, validation, and submission behavior when governing server-side or non-browser GA4 ingestion.
  - The pack MUST include Measurement Protocol event references when governing accepted GA4 event names and parameters.
  - The pack MUST keep request transport requirements separate from event taxonomy requirements.
  - The pack MUST reject Google Ads conversion upload APIs, offline conversion APIs, and non-GA4 ingestion APIs from Measurement Protocol scope.
  - The pack MUST not claim GA4 reporting or export conformance from Measurement Protocol request requirements alone.
  
  ## Evidence Expectations
  
  - Measurement Protocol templates must distinguish request evidence from event taxonomy evidence.
  - Templates should identify required fields, optional fields, error behavior, and validation evidence expectations.
  - Adjacent Google Ads conversion APIs should remain absent from this pack unless superseded by a later repo-local ADR.
